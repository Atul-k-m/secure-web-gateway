# URL categories: a small, hand-curated seed list.
#
# A domain covers its subdomains: "bbc.co.uk" also matches "www.bbc.co.uk".
# When a host matches more than one entry, the most specific one wins, so
# "mail.google.com" is webmail even though "google.com" is search.
# Commercial SWGs classify hundreds of millions of URLs; this list is only
# big enough to demonstrate policy.

search:
  - google.com
  - bing.com
  - duckduckgo.com

webmail:
  - mail.google.com
  - outlook.live.com
  - mail.yahoo.com
  - proton.me

social-media:
  - facebook.com
  - instagram.com
  - x.com
  - twitter.com
  - linkedin.com
  - reddit.com
  - tiktok.com

